<!DOCTYPE html>
<html>
<head>
    <title>Addition and Subtraction</title>
</head>
<body>
    <script>
        let num1 = parseFloat(prompt("Enter the 1st number:"));
        let num2 = parseFloat(prompt("Enter the 2nd number:"));
        let add = num1 + num2;
        console.log("Addition: " + add);
        alert("Addition: " + add);
        let subtract = num1 - num2;
        console.log("Subtraction: " + subtract);
        alert("Subtraction: " + subtract);
    </script>
</body>
</html>
